<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek 鲸鱼娘 · 可动模型</title>
<style>
  :root{
    --ink:#1b2340; --sub:#6b7699; --line:#dfe4f2; --accent:#3b5bdb;
    --glass:rgba(255,255,255,.72);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);overflow:hidden;
    background:
      radial-gradient(1200px 700px at 50% 8%, #ffffff 0%, #f0f3fb 45%, #dfe6f6 100%);
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #rig{
    position:relative;height:calc(100vh - 96px);aspect-ratio:1024/1980;
    filter:drop-shadow(0 26px 50px rgba(52,68,120,.16));
    touch-action:none;
  }
  #gl{display:block;width:100%;height:100%}
  #ghost{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
  #ghost img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  body.cmp #ghost{opacity:.5}

  /* ---------- loading ---------- */
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:#f4f6fc;z-index:99;transition:opacity .5s}
  #boot.gone{opacity:0;pointer-events:none}
  .spin{width:26px;height:26px;border:2px solid #cfd8ef;border-top-color:var(--accent);
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #boot p{font-size:13px;color:var(--sub);letter-spacing:.08em}

  /* ---------- chrome ---------- */
  .brand{position:fixed;top:26px;left:30px;z-index:10;pointer-events:none}
  .brand h1{font-size:16px;font-weight:700;letter-spacing:.02em}
  .brand p{font-size:11.5px;color:var(--sub);margin-top:3px;letter-spacing:.06em}

  .topright{position:fixed;top:24px;right:26px;z-index:10;display:flex;gap:8px}
  .chip{
    font:inherit;font-size:12px;padding:7px 13px;border-radius:9px;cursor:pointer;
    border:1px solid rgba(60,80,140,.14);background:var(--glass);
    backdrop-filter:blur(10px);color:#3d4770;transition:.18s;
  }
  .chip:hover{border-color:#a9b8e4;color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .dock{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:12;
    display:flex;gap:6px;padding:7px;border-radius:15px;
    background:var(--glass);backdrop-filter:blur(14px);
    border:1px solid rgba(60,80,140,.1);
    box-shadow:0 10px 30px rgba(45,60,110,.12);
  }
  .dock button{
    font:inherit;font-size:12.5px;padding:9px 15px;border-radius:10px;border:0;
    background:transparent;color:#4a5578;cursor:pointer;transition:.16s;white-space:nowrap;
  }
  .dock button:hover{background:rgba(59,91,219,.08);color:var(--accent)}
  .dock button.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(59,91,219,.3)}

  .gear{
    position:fixed;left:34px;bottom:30px;z-index:12;display:flex;align-items:center;gap:8px;
    font-size:11.5px;color:var(--sub);
  }
  .led{width:7px;height:7px;border-radius:50%;background:#34c759;box-shadow:0 0 0 3px rgba(52,199,89,.16)}
  .led.pause{background:#ff9f0a;box-shadow:0 0 0 3px rgba(255,159,10,.16)}

  /* ---------- drawer ---------- */
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:330px;z-index:20;
    background:rgba(252,253,255,.93);backdrop-filter:blur(18px);
    border-left:1px solid rgba(60,80,140,.1);
    transform:translateX(100%);transition:transform .32s cubic-bezier(.3,1,.4,1);
    display:flex;flex-direction:column;
  }
  .drawer.open{transform:none}
  .drawer header{padding:20px 22px 12px;display:flex;justify-content:space-between;align-items:center}
  .drawer h2{font-size:12px;letter-spacing:.14em;color:#8b94b3;font-weight:600}
  .x{width:26px;height:26px;border:0;background:#eef1f9;border-radius:8px;cursor:pointer;
     color:#66719a;font-size:15px;line-height:1}
  .drawer .body{padding:0 22px 24px;overflow-y:auto;flex:1}
  .grp{margin-bottom:18px}
  .grp label{display:flex;justify-content:space-between;font-size:11.5px;color:#5c6788;margin-bottom:6px}
  .grp label b{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
  input[type=range]{
    width:100%;height:18px;background:transparent;appearance:none;cursor:pointer;display:block;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#e3e8f6}
  input[type=range]::-webkit-slider-thumb{
    appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;
    border:2px solid var(--accent);margin-top:-5px;box-shadow:0 1px 4px rgba(59,91,219,.3);
  }
  .note{font-size:11px;color:#98a1bd;line-height:1.75;margin-top:6px}
  .layers{font-size:10.5px;line-height:2;color:#7c86a8;font-family:ui-monospace,Menlo,monospace;
          columns:2;column-gap:14px}
  .layers span{display:block}
  .layers span.hi{color:var(--accent);font-weight:600}

  @media (max-width:760px){
    .brand{left:16px;top:16px} .brand h1{font-size:14px}
    .topright{right:14px;top:14px}
    .dock{bottom:14px;gap:2px;padding:5px;max-width:96vw;overflow-x:auto}
    .dock button{padding:8px 10px;font-size:11.5px}
    .gear{display:none}
    .drawer{width:88vw}
  }
</style>
<style>
  /* 桌宠模式覆盖 */
  body{background:transparent!important;overflow:hidden}
  #boot{background:transparent!important}
  #boot p,#boot .spin,#ghost{display:none!important}
  .brand,.topright,.dock,.gear,.drawer{display:none!important}
  #rig{filter:none!important;height:100vh!important}
</style>
</head>
<body>

<div id="boot"><div class="spin"></div><p>正在加载 24 个图层…</p></div>

<div id="stage">
  <div id="rig">
    <canvas id="gl"></canvas>
    <div id="ghost"><img src="ghost.png" alt="原图"></div>
  </div>
</div>

<div class="brand">
  <h1>DeepSeek 鲸鱼娘</h1>
  <p>24 层 · 网格变形 · 拖动鼠标试试</p>
</div>

<div class="topright">
  <button class="chip" id="cmpBtn">叠加原图对比</button>
  <button class="chip" id="gearBtn">参数</button>
</div>

<div class="dock">
  <button data-act="idle" class="on">待机</button>
  <button data-act="hello">打招呼</button>
  <button data-act="armsup">伸懒腰</button>
  <button data-act="sway">摇摆</button>
  <button data-act="blink">眨眼</button>
  <button id="hatBtn">戴帽子</button>
</div>

<div class="gear"><span class="led" id="led"></span><span id="fps">—</span></div>

<div class="drawer" id="drawer">
  <header><h2>PARAMETERS</h2><button class="x" id="closeBtn">×</button></header>
  <div class="body">
    <div class="grp"><label>头部左右 AngleX <b id="v-ax">0</b></label>
      <input type="range" id="p-ax" min="-100" max="100" value="0"></div>
    <div class="grp"><label>头部俯仰 AngleY <b id="v-ay">0</b></label>
      <input type="range" id="p-ay" min="-100" max="100" value="0"></div>
    <div class="grp"><label>头部倾斜 AngleZ <b id="v-az">0</b></label>
      <input type="range" id="p-az" min="-100" max="100" value="0"></div>
    <div class="grp"><label>眨眼 EyeOpen <b id="v-eo">100</b></label>
      <input type="range" id="p-eo" min="0" max="100" value="100"></div>
    <div class="grp"><label>抬左臂 ArmL <b id="v-al">0</b></label>
      <input type="range" id="p-al" min="0" max="100" value="0"></div>
    <div class="grp"><label>抬右臂 ArmR <b id="v-ar">0</b></label>
      <input type="range" id="p-ar" min="0" max="100" value="0"></div>
    <div class="grp"><label>摆尾 Tail <b id="v-tl">0</b></label>
      <input type="range" id="p-tl" min="-100" max="100" value="0"></div>
    <div class="grp"><label>身体倾斜 BodyZ <b id="v-bz">0</b></label>
      <input type="range" id="p-bz" min="-100" max="100" value="0"></div>

    <div class="grp">
      <label>图层（23）</label>
      <div class="layers" id="layerList"></div>
      <p class="note">鼠标划过画面会热高亮对应部位；所有变形都是 GPU 网格弯曲，不是整体旋转。</p>
    </div>
  </div>
</div>

<script src="meta.js"></script>
<script src="tex.js"></script>
<script>
/* =========================================================
   DeepSeek 鲸鱼娘 — 网格变形播放器
   每层切成规则网格，逐顶点做 warp，再上传 buffer 绘制。
   参数全 0 时形变为恒等映射 → 与原图像素一致。
   ========================================================= */
const CW = 1024, CH = 2275;      // 纹理坐标系
const VW = 1024, VH = 1980;      // 显示窗口（裁掉上下留白）
const VY = 150;

/* ---------- 枢轴（图像像素坐标） ---------- */
const PIV = {
  foot:      [452, 2140],
  neck:      [452, 640],
  chest:     [452, 900],
  shoulderL: [300, 648],
  shoulderR: [558, 632],
  elbowL:    [238, 862],
  elbowR:    [596, 846],
  shoulderUpL: [318, 742],   // 举手差分：肩
  shoulderUpR: [778, 792],
  elbowUpL:    [162, 646],   // 举手差分：肘
  elbowUpR:    [836, 652],
  tailRoot:  [235, 1245],   // 尾根（藏在裙后）
  tailMid:   [660, 1570],   // 尾干从右腿后伸出、接上尾鳍的位置
  hairRoot:  [452, 520],
  ahogeRoot: [441, 243],
  finL:      [238, 412],
  waist:     [452, 1060],
  eyeLTop:   [380, 426],
  eyeRTop:   [512, 430]
};

/* ---------- 全局状态 ---------- */
const S = {
  t: 0, dt: 16,
  ax: 0, ay: 0, az: 0,        // 头 -1..1
  armL: 0, armR: 0,            // 0..1
  liftL: 0, liftR: 0,          // 举手差分混合 0..1
  wave: 0,                     // 挥手摆动
  hat: 0,                      // 帽子 0..1
  eyeOpen: 1,
  tail: 0,                     // -1..1
  bodyZ: 0,
  lean: 0,
  breathPhase: 0,
  blinkT: -1,
  act: 'idle',
  actT: 0,
  fpsOn: true
};

/* ---------- 缓动辅助 ---------- */
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp  = (a,b,t)=>a+(b-a)*t;
const smoothstep = (e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
function rotAround(x,y,cx,cy,a){
  const dx=x-cx, dy=y-cy, c=Math.cos(a), s=Math.sin(a);
  return [cx+dx*c-dy*s, cy+dx*s+dy*c];
}

/* =========================================================
   WebGL 初始化
   ========================================================= */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', {alpha:true, premultipliedAlpha:true, antialias:true});
if(!gl){
  document.getElementById('boot').innerHTML =
    '<div style="text-align:center;line-height:2;padding:28px">' +
    '<div style="font-size:16px;color:#2a3a5e;font-weight:600">这台设备的浏览器没有开启 WebGL 2</div>' +
    '<div style="font-size:13px;color:#7d8bab;margin:6px 0 18px">常见于微信内置浏览器 / 部分安卓浏览器。动作没丢，下面有动图版。</div>' +
    '<a href="index.html" style="display:inline-block;padding:11px 22px;border-radius:12px;' +
    'background:linear-gradient(135deg,#3f7bff,#6aa8ff);color:#fff;text-decoration:none;font-size:14px">← 看动图版</a>' +
    '</div>';
  throw new Error('NO_WEBGL');
}

const VS = `#version 300 es
in vec2 aPos; in vec2 aUV;
uniform vec2 uRes;
uniform vec2 uOff;
out vec2 vUV;
void main(){
  vec2 p = (aPos - uOff) / uRes;
  vec2 ndc = vec2(p.x*2.0-1.0, 1.0-p.y*2.0);
  gl_Position = vec4(ndc,0.0,1.0);
  vUV = aUV;
}`;
const FS = `#version 300 es
precision mediump float;
in vec2 vUV;
uniform sampler2D uTex;
uniform float uAlpha;
out vec4 outColor;
void main(){
  vec4 c = texture(uTex, vUV);
  float a = c.a * uAlpha;
  if(a < 0.003) discard;
  outColor = vec4(c.rgb, a);
}`;

function mkShader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);
const uRes = gl.getUniformLocation(prog, 'uRes');
const uOff = gl.getUniformLocation(prog, 'uOff');
const uTex = gl.getUniformLocation(prog, 'uTex');
const uAlpha = gl.getUniformLocation(prog, 'uAlpha');

gl.enable(gl.BLEND);
gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
gl.clearColor(0,0,0,0);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);

/* =========================================================
   图层构建
   ========================================================= */
const layers = [];
let ready = false;

function buildLayer(name, img){
  const m = LAYER_META[name];
  const w = m.w, h = m.h;
  const nx = clamp(Math.ceil(w/26), 4, 34);
  const ny = clamp(Math.ceil(h/26), 4, 34);
  const nv = (nx+1)*(ny+1);

  const base = new Float32Array(nv*2);   // 初始像素坐标
  const pos  = new Float32Array(nv*2);   // 变形后
  const uv   = new Float32Array(nv*2);
  const idx  = new Uint16Array(nx*ny*6);

  for(let j=0;j<=ny;j++){
    for(let i=0;i<=nx;i++){
      const k = j*(nx+1)+i;
      const lx = w*i/nx, ly = h*j/ny;
      base[k*2]   = m.x + lx;
      base[k*2+1] = m.y + ly;
      uv[k*2]     = lx/w;
      uv[k*2+1]   = ly/h;
    }
  }
  let p=0;
  for(let j=0;j<ny;j++){
    for(let i=0;i<nx;i++){
      const a=j*(nx+1)+i, b=a+1, c=a+nx+1, d=c+1;
      idx[p++]=a; idx[p++]=c; idx[p++]=b;
      idx[p++]=b; idx[p++]=c; idx[p++]=d;
    }
  }

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const pb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, pb);
  gl.bufferData(gl.ARRAY_BUFFER, pos, gl.DYNAMIC_DRAW);
  const aPos = gl.getAttribLocation(prog,'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const ub = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ub);
  gl.bufferData(gl.ARRAY_BUFFER, uv, gl.STATIC_DRAW);
  const aUV = gl.getAttribLocation(prog,'aUV');
  gl.enableVertexAttribArray(aUV);
  gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 0, 0);

  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindVertexArray(null);

  layers.push({name, m, img, nx, ny, nv, base, pos, vao, pb, tex, idxCount: idx.length});
}

/* =========================================================
   形变：把 (x,y) 从原图位置映射到当前姿态
   ========================================================= */
const D2R = Math.PI/180;

function deform(name, x, y, out){
  /* ---- 1. 全身呼吸 / 身体倾斜 ---- */
  const br = Math.sin(S.breathPhase);
  const bs = 1 + br*0.0048;               // 呼吸缩放
  let cx = PIV.foot[0], cy = PIV.foot[1];
  let dx = x-cx, dy = y-cy;
  dx *= bs; dy *= bs;
  let nx = cx+dx, ny = cy+dy + br*3.2;

  const bodyA = (S.bodyZ*3.0 + S.lean) * D2R;
  if(Math.abs(bodyA) > 1e-5){
    [nx, ny] = rotAround(nx, ny, PIV.waist[0], PIV.waist[1], bodyA);
  }

  /* ---- 2. 头部组 ---- */
  const HEAD_GROUP = (name==='Head'||name==='Eye_L'||name==='Eye_R'||
                      name==='Hair_Front'||name==='Headdress'||
                      name==='FinEar_L'||name==='Ahoge'||name==='Hat');

  if(HEAD_GROUP){
    const lag = (name==='FinEar_L') ? 0.90 : 1;   // Hair_Front 里含脸部像素，必须与头完全同步
    const hx = S.ax*lag, hy = S.ay*lag, hz = S.az*lag;
    // 颈部枢轴
    let px = PIV.neck[0], py = PIV.neck[1];
    [nx, ny] = rotAround(nx, ny, px, py, hz*4.0*D2R);
    nx += hx*10;
    ny += hy*7;

    // 呆毛：弹性摆动
    if(name==='Ahoge'){
      const a = Math.sin(S.t*3.1)*7 + S.az*9 + S.ax*10;
      [nx, ny] = rotAround(nx, ny, PIV.ahogeRoot[0], PIV.ahogeRoot[1], a*D2R);
    }
    // 鳍耳：延迟摆动
    if(name==='FinEar_L'){
      const a = Math.sin(S.t*2.2-0.7)*4 + S.az*6;
      [nx, ny] = rotAround(nx, ny, PIV.finL[0], PIV.finL[1], a*D2R);
    }
    // 眼睛：绕上缘压扁
    if(name==='Eye_L' || name==='Eye_R'){
      const top = (name==='Eye_L' ? PIV.eyeLTop : PIV.eyeRTop);
      // 先做局部压缩（相对层自身）
      const oy = top[1];
      ny = oy + (ny - oy) * S.eyeOpen;
    }
  }

  /* ---- 2b. 底层兜底：Base_Body 的上半身跟随头部一起转，
         这样低头/转头时下面永远不会有"第二张脸"的错位轮廓 ---- */
  if(name === 'Base_Body'){
    const wHead = 1 - smoothstep(PIV.neck[1]-90, PIV.neck[1]+55, y);   // y 越小权重越大
    if(wHead > 0.002){
      const R = (S.az*4.0*D2R) * wHead;
      [nx, ny] = rotAround(nx, ny, PIV.neck[0], PIV.neck[1], R);
      nx += S.ax*10*wHead;
      ny += S.ay*7*wHead;
    }
  }

  /* ---- 3. 后发：绕根部 + 下部摆幅 ---- */
  if(name==='Hair_Back'){
    const swing = Math.sin(S.t*1.35-0.6)*1.5 + Math.sin(S.t*0.7)*0.7 + S.az*3.2;
    const w = smoothstep(480, 900, y);      // 越往下越飘
    [nx, ny] = rotAround(nx, ny, PIV.hairRoot[0], PIV.hairRoot[1], swing*w*D2R);
  }

  /* ---- 4. 尾巴：两段关节 + 沿尾长传播的行波 ----
       根部权重严格为 0（否则尾根会从裙底脱开），
       尾尖幅度最大并带相位滞后，看起来是"一条软的尾巴在甩"，
       而不是"一整节硬掰 + 一节留在原地"。 */
  if(name==='Tail'){
    const d  = Math.hypot(x-PIV.tailRoot[0], y-PIV.tailRoot[1]);
    const w1 = smoothstep(18, 300, d);      // 根部 → 中段
    const w2 = smoothstep(380, 780, d);     // 中段 → 尾尖
    const ph = S.t*1.30;
    const a1 = (S.tail*2.2 + Math.sin(ph)*1.1) * w1;
    const a2 = (S.tail*3.4 + Math.sin(ph-0.95)*2.3) * w2;
    const a1r = a1*D2R, a2r = a2*D2R;
    // 第一关节：尾根
    [nx, ny] = rotAround(nx, ny, PIV.tailRoot[0], PIV.tailRoot[1], a1r);
    // 第二关节：中段（枢轴已被第一关节带走）
    const [jx, jy] = rotAround(PIV.tailMid[0], PIV.tailMid[1],
                               PIV.tailRoot[0], PIV.tailRoot[1], a1r);
    [nx, ny] = rotAround(nx, ny, jx, jy, a2r);
  }

  /* ---- 5. 手臂：肩→肘 双骨骼链 ---- */
  const ARM = {
    L: {sh: PIV.shoulderL, el: PIV.elbowL, amp: S.armL*18, sign: +1},
    R: {sh: PIV.shoulderR, el: PIV.elbowR, amp: S.armR*18, sign: -1}
  };
  for(const side of ['L','R']){
    const A = ARM[side];
    // 手必须跟着前臂走，否则手臂一转、手留在原地 → 腕部断裂
    const isHand = (name === 'Hand_'+side);
    if(name !== 'Arm_Upper_'+side && name !== 'Arm_Lower_'+side && !isHand) continue;
    if(Math.abs(A.amp) < 1e-4) continue;
    const a = A.amp * A.sign * D2R;
    // 上臂：绕肩旋转，肩点处权重为 0（布料粘连），向外逐渐完全跟随
    const dSh = Math.hypot(x-A.sh[0], y-A.sh[1]);
    const wSh = smoothstep(0, 38, dSh);
    [nx, ny] = rotAround(nx, ny, A.sh[0], A.sh[1], a*wSh);
    if(name === 'Arm_Lower_'+side || isHand){
      // 肘点已被上臂带走，前臂绕新肘点再弯一次
      const [ex, ey] = rotAround(A.el[0], A.el[1], A.sh[0], A.sh[1], a);
      const dEl = Math.hypot(x-A.el[0], y-A.el[1]);
      [nx, ny] = rotAround(nx, ny, ex, ey, a*0.35*smoothstep(0, 40, dEl));
    }
    break;
  }

  /* ---- 5b. 举手手臂（差分图，肩/肘双骨骼） ---- */
  if(name.indexOf('ArmUp_') === 0){
    const side = name.charAt(name.length-1);
    const sgn  = side==='L' ? 1 : -1;
    const sh   = side==='L' ? PIV.shoulderUpL : PIV.shoulderUpR;
    const el   = side==='L' ? PIV.elbowUpL : PIV.elbowUpR;
    const lift = side==='L' ? S.liftL : S.liftR;
    // 上臂几乎不转（按差分包住腋下蕾丝，转动会与底层错位）；
    // 挥手靠前臂绕肘摆动
    const a = lift*1.2*sgn*D2R;
    if(name.indexOf('Lower') >= 0){
      const [ex, ey] = rotAround(el[0], el[1], sh[0], sh[1], a);
      const dEl = Math.hypot(x-el[0], y-el[1]);
      [nx, ny] = rotAround(nx, ny, ex, ey, S.wave*26*sgn*D2R*smoothstep(8,64,dEl));
    }else{
      [nx, ny] = rotAround(nx, ny, sh[0], sh[1], a);
    }
  }

  /* ---- 6. 裙摆：轻微起伏 ---- */
  if(name==='Skirt'){
    const a = S.bodyZ*1.6 + Math.sin(S.t*1.1)*0.7;
    [nx, ny] = rotAround(nx, ny, PIV.waist[0], PIV.waist[1], a*D2R);
  }

  out[0]=nx; out[1]=ny;
}

/* =========================================================
   渲染循环
   ========================================================= */
let last = performance.now(), fpsAcc = 0, fpsCnt = 0;
let rafId = 0, drawTick = 0;
const tmp = [0,0];

function frame(now){
  if(S.frozen){ rafId = 0; return; }
  const dt = Math.min(60, now-last); last = now;
  S.dt = dt; S.t += dt/1000;
  S.breathPhase += dt/1000 * 1.55;

  updateAct(dt);

  // 眨眼自动
  if(S.blinkT < 0 && Math.random() < dt/3800) S.blinkT = 0;
  if(S.blinkT >= 0){
    S.blinkT += dt;
    const T = 150;
    const u = S.blinkT / T;
    S.eyeOpen = u < 0.42 ? 1 - smoothstep(0,0.42,u) : smoothstep(0.42,1,u);
    S.eyeOpen = clamp(S.eyeOpen, 0.04, 1);
    if(S.blinkT > T){ S.blinkT = -1; S.eyeOpen = 1; }
  }

  applyPose();
  // 空闲时降到 30fps：呼吸/尾巴的逻辑照常算，只把 GPU 绘制减半
  if(S.act==='idle' && !pointer && (drawTick++ & 1)){ rafId = requestAnimationFrame(frame); return; }
  draw();

  fpsAcc += dt; fpsCnt++;
  if(fpsAcc > 500){
    document.getElementById('fps').textContent = Math.round(1000*fpsCnt/fpsAcc) + ' fps';
    fpsAcc = 0; fpsCnt = 0;
  }
  rafId = requestAnimationFrame(frame);
}

function draw(){
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const rect = canvas.getBoundingClientRect();
  const w = Math.round(rect.width*dpr), h = Math.round(rect.height*dpr);
  if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
  gl.viewport(0,0,w,h);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(uRes, VW, VH);
  gl.uniform2f(uOff, 0, VY);

  /* 眼睛层是整块矩形（含眼周皮肤），常驻会在脸侧露出矩形边。
     只在眨眼时显示（此时它被压扁、只覆盖眼睛高度），其余时间由底层原图提供眼睛。 */
  const eyeOn = (S.eyeOpen < 0.995) ? 1 : 0;
  for(const L of layers){
    if(L.name==='Eye_L' || L.name==='Eye_R') L.alpha = eyeOn;
  }

  for(const L of layers){
    if(L.skip) continue;
    if(L.alpha !== undefined && L.alpha < 0.004) continue;
    const {base, pos, nv} = L;
    for(let i=0;i<nv;i++){
      deform(L.name, base[i*2], base[i*2+1], tmp);
      pos[i*2] = tmp[0]; pos[i*2+1] = tmp[1];
    }
    gl.bindVertexArray(L.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, L.pb);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, pos);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, L.tex);
    gl.uniform1i(uTex, 0);
    gl.uniform1f(uAlpha, L.alpha === undefined ? 1 : L.alpha);
    gl.drawElements(gl.TRIANGLES, L.idxCount, gl.UNSIGNED_SHORT, 0);
  }
  gl.bindVertexArray(null);
}

/* =========================================================
   动作编排
   ========================================================= */
/* 每个动作的时长（秒）。到点自动回 idle，不依赖调用方收尾。 */
const ACT_DUR = { hello: 3.2, armsup: 2.8, sway: 6.0 };

function updateAct(dt){
  // 用真实时间算动作进度：掉帧时 dt 会被截断，累计值会拖长动作
  if(!S.actStart) S.actStart = performance.now();
  S.actT = (performance.now() - S.actStart) / 1000;
  // 兜底收尾：不管动作是按钮、点击还是安卓端 evaluateJavascript 触发的，
  // 都从这里回 idle，避免 act 卡在 hello 一直举手。
  const dur = ACT_DUR[S.act];
  if(dur && S.actT > dur) setAct('idle');
  const ease = (a,b,t)=>lerp(a,b,1-Math.pow(0.001, dt/1000*3));

  if(S.act==='idle'){
    S.armL = lerp(S.armL, 0, 0.06);
    S.armR = lerp(S.armR, 0, 0.06);
    S.bodyZ = lerp(S.bodyZ, 0, 0.05);
    S.tail = Math.sin(S.t*1.15)*0.75;
    S.az = S.az*0.94;
    if(S.axAuto !== false){ /* 由鼠标驱动 */ }
  }else if(S.act==='hello'){
    const t = S.actT;
    const on = t < 2.4;
    S.armR = lerp(S.armR, on ? 0.52 : 0, 0.07);
    S.bodyZ = lerp(S.bodyZ, on ? -0.16 : 0, 0.05);
    S.az   = lerp(S.az, on ? -0.16 + Math.sin(t*7)*0.06 : 0, 0.07);
    S.ay   = lerp(S.ay, on ? -0.10 : 0, 0.06);
    S.tail = Math.sin(S.t*1.9)*0.85;
  }else if(S.act==='armsup'){
    const t = S.actT;
    const on = t<2.0;
    S.armL = lerp(S.armL, on?0.6:0, 0.08);
    S.armR = lerp(S.armR, on?0.6:0, 0.08);
    S.az   = lerp(S.az, on?-0.06:0, 0.06);
    S.tail = Math.sin(S.t*1.3)*0.6;
  }else if(S.act==='sway'){
    S.bodyZ = Math.sin(S.t*1.9)*0.55;
    S.az    = Math.sin(S.t*1.9)*0.28;
    S.ax    = Math.sin(S.t*1.9)*0.35;
    S.tail  = Math.sin(S.t*1.9+0.6)*0.85;
    S.armL  = 0.12 + Math.sin(S.t*1.9)*0.06;
    S.armR  = 0.12 - Math.sin(S.t*1.9)*0.06;
  }

  /* 差分举手量：跟动作时间挂钩，收尾前 0.4s 放下，动作结束自然回到 idle 姿势 */
  const liftUntil = S.act==='hello' ? 2.4 : S.act==='armsup' ? 2.0 : 0;
  const lifting = S.actT < liftUntil;
  const wantL = lifting ? 1 : 0;   // 打招呼也双手举：单举时另一侧会露出原图叉腰的手臂
  const wantR = lifting ? 1 : 0;
  S.liftL = lerp(S.liftL, wantL, 0.3);
  S.liftR = lerp(S.liftR, wantR, 0.3);
  S.hat = lerp(S.hat, S.hatOn ? 1 : 0, 0.12);
  if(S.act==='hello') S.wave = Math.sin(S.t*7.6)*0.95;
  else S.wave = lerp(S.wave, 0, 0.12);
}

/* 每层透明度：两套手臂 + 身体底板 + 腰部补白交叉淡化 */
function applyPose(){
  for(const L of layers){
    const n = L.name;
    let a = 1;
    // 手臂换姿势用"硬切换"：两套素材姿势差太大，任何淡入淡出都会看到半透明手臂
    const mL = smoothstep(0.40, 0.46, S.liftL);
    const mR = smoothstep(0.40, 0.46, S.liftR);
    if(n === 'Arm_Upper_L' || n === 'Arm_Lower_L') a = 1 - mL;
    else if(n === 'Arm_Upper_R' || n === 'Arm_Lower_R') a = 1 - mR;
    else if(n === 'ArmUp_Upper_L' || n === 'ArmUp_Lower_L') a = mL;
    else if(n === 'ArmUp_Upper_R' || n === 'ArmUp_Lower_R') a = mR;
    else if(n === 'Hand_L') a = 1 - mL;
    // 身体底板：举手时换成"去掉叉腰手臂"的那张，腰侧才不会出现原画手臂残影
    else if(n === 'Base_Body') a = (mL > 0.5 || mR > 0.5) ? 0 : 1;
    else if(n === 'Base_NoArm') a = (mL > 0.5 || mR > 0.5) ? 1 : 0;
    else if(n === 'Hat') a = S.hat;
    L.alpha = a;
  }
}

/* =========================================================
   交互
   ========================================================= */
const rig = document.getElementById('rig');
let pointer = null, lastPtr = 0, idleReturn = true;

rig.addEventListener('pointermove', e=>{
  const r = rig.getBoundingClientRect();
  const nx = (e.clientX - r.left)/r.width;   // 0..1
  const ny = (e.clientY - r.top)/r.height;
  pointer = {x: nx, y: ny};
  lastPtr = performance.now();
  if(S.act==='sway') setAct('idle');
});
rig.addEventListener('pointerleave', ()=>{ pointer = null; });

// 鼠标驱动头部跟随
setInterval(()=>{
  if(pointer && performance.now()-lastPtr < 2400){
    const tx = clamp((pointer.x-0.5)*2.0, -1, 1);
    const ty = clamp((pointer.y-0.32)*2.2, -1, 1);
    S.ax = lerp(S.ax, tx*0.85, 0.10);
    S.ay = lerp(S.ay, ty*0.65, 0.10);
    if(S.act==='idle' || S.act==='hello') {
      S.az = lerp(S.az, tx*0.14, 0.08);
    }
  }else{
    S.ax = lerp(S.ax, 0, 0.045);
    S.ay = lerp(S.ay, 0, 0.045);
    if(S.act!=='sway') S.az = lerp(S.az, 0, 0.045);
  }
}, 33);

document.getElementById('hatBtn').addEventListener('click', e=>{
  e.stopPropagation();
  S.hatOn = !S.hatOn;
  e.currentTarget.classList.toggle('on', S.hatOn);
  e.currentTarget.textContent = S.hatOn ? '摘帽子' : '戴帽子';
});

function setAct(name){
  S.act = name; S.actT = 0; S.actStart = performance.now();
  document.querySelectorAll('.dock button').forEach(b=>{
    b.classList.toggle('on', b.dataset.act===name);
  });
  if(name==='blink'){
    S.blinkT = 0;
    setTimeout(()=>{ if(S.act==='blink') setAct('idle'); }, 260);
  }
}
document.querySelectorAll('.dock button').forEach(b=>{
  if(b.id === 'hatBtn') return;
  b.onclick = ()=>{
    if(b.dataset.act==='blink'){ S.blinkT = 0; return; }
    setAct(b.dataset.act);
    if(b.dataset.act!=='idle' && b.dataset.act!=='sway'){
      setTimeout(()=>{ if(S.act===b.dataset.act) setAct('idle'); }, 8000);
    }
  };
});

// 对比
document.getElementById('cmpBtn').onclick = e=>{
  document.body.classList.toggle('cmp');
  e.target.classList.toggle('on', document.body.classList.contains('cmp'));
};

// 抽屉
const drawer = document.getElementById('drawer');
document.getElementById('gearBtn').onclick = ()=> drawer.classList.toggle('open');
document.getElementById('closeBtn').onclick = ()=> drawer.classList.remove('open');

// 参数滑杆
const bind = (id, vid, fn, scale=100)=>{
  const el = document.getElementById('p-'+id), out = document.getElementById('v-'+vid);
  el.addEventListener('input', ()=>{
    const v = +el.value; out.textContent = v; fn(v/scale);
  });
};
bind('ax','ax', v=>S.ax=v);
bind('ay','ay', v=>S.ay=v);
bind('az','az', v=>S.az=v);
bind('eo','eo', v=>{S.eyeOpen=v; S.blinkT=-1;});
bind('al','al', v=>{S.armL=v; S.act='manual';});
bind('ar','ar', v=>{S.armR=v; S.act='manual';});
bind('tl','tl', v=>S.tail=v);
bind('bz','bz', v=>S.bodyZ=v);

/* =========================================================
   启动
   ========================================================= */
const layerListEl = document.getElementById('layerList');
LAYER_ORDER.forEach((n,i)=>{
  const s = document.createElement('span');
  s.textContent = String(i+1).padStart(2,'0')+' '+n;
  layerListEl.appendChild(s);
});

window.freeze = ()=>{ S.frozen = true; };
window.unfreeze = ()=>{
  if(!S.frozen) return;
  S.frozen = false; last = performance.now();
  if(!rafId) rafId = requestAnimationFrame(frame);
};
window.redraw = ()=> draw();

/* 给安卓壳做点击命中测试：把当前姿态的各层合成成一张低分辨率 alpha 掩码，
   '1' 表示该格有内容。壳子用它区分「点在人物身上」还是「点在旁边空气里」。 */
window.hitMask = function(cols, rows){
  const cv = document.createElement('canvas');
  cv.width = cols; cv.height = rows;
  const c = cv.getContext('2d');
  for(const L of layers){
    const m = L.m;
    if(!m || !L.img || L.alpha === 0) continue;
    c.drawImage(L.img,
      (m.x/CW)*cols, ((m.y-VY)/VH)*rows,
      (m.w/CW)*cols, (m.h/VH)*rows);
  }
  const d = c.getImageData(0, 0, cols, rows).data;
  let s = '';
  for(let i=3;i<d.length;i+=4) s += d[i] > 24 ? '1' : '0';
  return s;
};

(async function boot(){
  const imgs = await Promise.all(LAYER_ORDER.map(n=>new Promise((res,rej)=>{
    const im = new Image();
    im.onload = ()=>res([n,im]);
    im.onerror = rej;
    im.src = (window.TEX && window.TEX[n]) ? window.TEX[n] : ('tex/'+n+'.png');
  })));
  for(const [n,im] of imgs) buildLayer(n, im);
  ready = true;
  document.getElementById('boot').classList.add('gone');
  requestAnimationFrame(frame);
})();
</script>
<script>
/* 桌宠模式：闲时随机小动作 */
(function(){
  setInterval(function(){
    try{
      if(typeof S!=='undefined' && S.act==='idle'){
        var r=Math.random();
        if(r<0.5) setAct('blink'); else if(r<0.68) setAct('sway');
      }
    }catch(e){}
  }, 9000);
})();
</script>
